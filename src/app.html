<!doctype html>
<html
  data-theme="%theme%"
  lang="en">
  <head>
    <meta charset="utf-8" />
    <script>
      (function () {
        var match = document.cookie.match(/(?:^|; )theme=(dark|light)/);
        var theme = match
          ? match[1]
          : matchMedia("(prefers-color-scheme: dark)").matches
            ? "dark"
            : "light";
        document.documentElement.dataset.theme = theme;
        if (!match) {
          document.cookie =
            "theme=" + theme + "; path=/; max-age=31536000; samesite=lax";
        }
      })();
    </script>
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1" />
    <meta
      name="text-scale"
      content="scale" />
    <meta
      content="#f9fafb"
      media="(prefers-color-scheme: light)"
      name="theme-color" />
    <meta
      content="#1e2939"
      media="(prefers-color-scheme: dark)"
      name="theme-color" />
    %sveltekit.head%
  </head>
  <body
    class="size-full bg-app-background-light p-2 pb-12 font-serif text-lg text-app-text-light dark:bg-app-background-dark dark:text-app-text-dark"
    data-sveltekit-preload-data="hover">
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
