<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1" />
    <meta
      name="text-scale"
      content="scale" />
    <meta
      content="light dark"
      name="color-scheme" />
    <meta
      content="#f9fafb"
      media="(prefers-color-scheme: light)"
      name="theme-color" />
    <meta
      content="#1e2939"
      media="(prefers-color-scheme: dark)"
      name="theme-color" />
    %sveltekit.head%
  </head>
  <body
    class="size-full bg-app-background-light pb-12 font-serif text-app-text-light dark:bg-app-background-dark dark:text-app-text-dark"
    data-sveltekit-preload-data="hover">
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
